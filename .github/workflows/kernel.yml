name: Build Android Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Target Defconfig'
        required: true
        default: 'vendor/bengal-perf_defconfig vendor/xiaomi/fog.config vendor/ksu.config vendor/debugfs.config vendor/cust.config'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'alternoegraha/kernel_xiaomi_sm6225'
          ref: 'motregen'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq --no-install-recommends \
            clang-20 lld-20 llvm-20 clang-20-doc \
            bc bison build-essential ccache \
            curl flex git gperf libelf-dev libncurses5-dev \
            libssl-dev libxml2-dev libxml2-utils lzop make ninja-build python3 zip zlib1g-dev

      - name: Fetch CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-kernel-fog-clang20
          restore-keys: ${{ runner.os }}-kernel-fog-clang20
          max-size: 1G
          create-symlink: true

      - name: Find FTS driver files
        run: |
          echo -e 'fts dir\n\n'
          find drivers/input/touchscreen -type d \( -name "*fts*" -o -name "*focal*" \) || true
          echo -e '\nfts files\n\n'
          ls -R drivers/input/touchscreen/ | grep -i -E "fts|focal" || true
          echo -e '\nfwupg\n\n'
          grep -rn "fts_fwupg_work\|fts_fwupg_init\|fw upgrade work" drivers/input/touchscreen/ --include="*.c" | head -n 30 || true
          echo -e '\ncharger mode\n\n'
          grep -rn "lct_fts_set_charger_mode" drivers/input/touchscreen/ --include="*.c" | head -n 20 || true

      - name: Patch FTS panel FW
        run: |
          echo -e 'patch fwupg\n\n'
          python3 - << 'PY'
          import pathlib
          p = pathlib.Path("drivers/input/touchscreen/ft8006s_spi/focaltech_flash.c")
          t = p.read_text()
          old = "int fts_fwupg_init(struct fts_ts_data *ts_data)"
          assert old in t, "fts_fwupg_init not found"
          t = t.replace(old, old + "\n{\n    FTS_INFO(\"fw upgrade disabled - keep replacement panel FW\");\n    return 0;\n}\nint fts_fwupg_init_disabled(struct fts_ts_data *ts_data)", 1)
          p.write_text(t)
          print("patched fwupg")
          PY
          grep -n "fw upgrade disabled" drivers/input/touchscreen/ft8006s_spi/focaltech_flash.c || true
          
      - name: Configure and Build Kernel
        run: |
          mkdir -p $(pwd)/bin

          cat << 'EOF' > $(pwd)/bin/clang
          #!/bin/bash
          exec ccache /usr/bin/clang-20 "$@"
          EOF
          chmod +x $(pwd)/bin/clang

          cat << 'EOF' > $(pwd)/bin/clang++
          #!/bin/bash
          exec ccache /usr/bin/clang++-20 "$@"
          EOF
          chmod +x $(pwd)/bin/clang++

          for tool in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf llvm-addr2line; do
            ln -sf /usr/bin/${tool}-20 $(pwd)/bin/${tool}
          done
          
          export PATH="$(pwd)/bin:$PATH"
          export CC=clang
          export CXX=clang++
          
          cat > arch/arm64/configs/vendor/cust.config << EOF
          CONFIG_BINFMT_MISC=y
          CONFIG_KCMP=y
          CONFIG_CHECKPOINT_RESTORE=y
          EOF
          
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig }}

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fog
          path: |
            out/arch/arm64/boot/*
