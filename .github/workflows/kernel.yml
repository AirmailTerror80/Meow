name: Build Android Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Target Defconfig'
        required: true
        default: 'vendor/bengal-perf_defconfig vendor/xiaomi/fog.config vendor/ksu.config vendor/debugfs.config vendor/cust.config'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'alternoegraha/kernel_xiaomi_sm6225'
          ref: 'motregen'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq --no-install-recommends \
            clang-20 lld-20 llvm-20 clang-20-doc \
            bc bison build-essential ccache \
            curl flex git gperf libelf-dev libncurses5-dev \
            libssl-dev libxml2-dev libxml2-utils lzop make ninja-build python3 zip zlib1g-dev

      - name: Fetch CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-kernel-fog-clang20
          restore-keys: ${{ runner.os }}-kernel-fog-clang20
          max-size: 1G
          create-symlink: true

      - name: Configure and Build Kernel
        run: |
          mkdir -p $(pwd)/bin

          cat << 'EOF' > $(pwd)/bin/clang
          #!/bin/bash
          exec ccache /usr/bin/clang-20 "$@"
          EOF
          chmod +x $(pwd)/bin/clang

          cat << 'EOF' > $(pwd)/bin/clang++
          #!/bin/bash
          exec ccache /usr/bin/clang++-20 "$@"
          EOF
          chmod +x $(pwd)/bin/clang++

          export PATH="$(pwd)/bin:$PATH"
          export CC=clang
          export CXX=clang++
          
          cat > arch/arm64/configs/vendor/cust.config << EOF
          CONFIG_BINFMT_MISC=y
          CONFIG_KCMP=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI=y
          CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI_FW_UPDATE=y
          # CONFIG_TOUCHSCREEN_NT36XXX is not set
          # CONFIG_TOUCHSCREEN_FTS is not set
          # CONFIG_TOUCHSCREEN_FTS_SPI is not set
          EOF
          
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig }}

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      - name: Output Files
        run: |
          ls -lh out/arch/arm64/boot || true
          
          find out -name "*nt36*" || true
          find out -name "*nt36525*" || true

          find out -name "*.o" -path "*nt36*" || true
          find out -name "*.o" -path "*nt36535*" || true

          grep -E "NT36xxx_HOSTDL_SPI|TOUCHSCREEN_FTS|TOUCHSCREEN_NT36XXX" out/.config || true
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fog
          path: |
            out/arch/arm64/boot/*
