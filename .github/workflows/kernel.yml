name: Build Android Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Target Defconfig'
        required: true
        default: 'vendor/bengal-perf_defconfig vendor/xiaomi/fog.config vendor/ksu.config vendor/debugfs.config vendor/cust.config'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'alternoegraha/kernel_xiaomi_sm6225'
          ref: 'motregen'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq --no-install-recommends \
            bc bison build-essential ccache \
            curl flex git gperf libelf-dev libncurses5-dev \
            libssl-dev libxml2-dev libxml2-utils lzop make ninja-build python3 zip zlib1g-dev

      - name: Fetch CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-kernel-fog-clang-r584948
          restore-keys: ${{ runner.os }}-kernel-fog-clang-r584948
          max-size: 1G
          create-symlink: true

      - name: Get clang-r584948
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $HOME/clang-src
          
          cd $HOME/clang-src
          git sparse-checkout set clang-r584948
          
          cd -
          mkdir -p $(pwd)/bin
          
          cat << 'EOF' > $(pwd)/bin/clang
          #!/bin/bash
          exec ccache $HOME/clang-src/clang-r584948/bin/clang "$@"
          EOF
          chmod +x $(pwd)/bin/clang
          
          cat << 'EOF' > $(pwd)/bin/clang++
          #!/bin/bash
          exec ccache $HOME/clang-src/clang-r584948/bin/clang++ "$@"
          EOF
          chmod +x $(pwd)/bin/clang++
          
      - name: Patch FTS panel FW
        run: |
          python3 - << 'PY'
          import pathlib
          p = pathlib.Path("drivers/input/touchscreen/ft8006s_spi/focaltech_flash.c")
          t = p.read_text()
          old = "int fts_fwupg_init(struct fts_ts_data *ts_data)"
          assert old in t, "fts_fwupg_init not found"
          t = t.replace(old, old + "\n{\n    return 0;\n}\nint fts_fwupg_init_disabled(struct fts_ts_data *ts_data)", 1)
          p.write_text(t)
          print("patched fwupg")
          PY

      - name: Configure and Build Kernel
        run: |
          export PATH="$(pwd)/bin:$HOME/clang-src/clang-r584948/bin:$PATH"
          export CC=clang
          export CXX=clang++

          cat > arch/arm64/configs/vendor/cust.config << EOF
          CONFIG_BINFMT_MISC=y
          CONFIG_KCMP=y
          CONFIG_CHECKPOINT_RESTORE=y
          EOF

          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig }}

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fog
          path: |
            out/arch/arm64/boot/*
