name: Build Blender Binary

on: 
  workflow_dispatch:

jobs: 
  build: 
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install Host-side Packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends \
            cmake build-essential git ccache clang lld \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxxf86vm-dev libxfixes-dev libegl-dev wayland-protocols libpulse-dev \
            libwayland-dev libxkbcommon-dev libdbus-1-dev curl unzip libomp-dev
        
      - name: Checkout Blender
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          path: blender
          ref: blender-v4.2-release
          fetch-depth: 1
          submodules: true

      - name: Fetch LFS
        run: |
          cd blender
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git lfs pull
          
      - name: Fetch Dependencies
        run: |
          mkdir -p ${{ github.workspace }}/build_deps
          cd ${{ github.workspace }}/build_deps
          
          curl -L "https://github.com/AirmailTerror80/Meow/releases/download/arm64-deps-4.2/blender-deps-4.2-arm64.tar.xz" -o deps.tar.xz
          
          tar -xvf deps.tar.xz
          rm deps.tar.xz

      - name: Fix Perms
        run: |
          export LIBDIR="${{ github.workspace }}/build_deps/Release"
          find "$LIBDIR" -type f \( -path "*/bin/*" -o -name "*.so*" -o -name "*.sh" \) -exec chmod +x {} +
          ls -lha "$LIBDIR"

      - name: Fetch CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-aarch64-blender-4.2-bin
          restore-keys: ccache-Linux-aarch64-blender-4.2-bin
          max-size: 2G
          create-symlink: true
          
      - name: Build Blender
        run: |
          export LIBDIR="${{ github.workspace }}/build_deps/Release"
          
          mkdir -p $(pwd)/bin
          
          cat << 'EOF' > $(pwd)/bin/clang
          #!/bin/bash
          exec ccache /usr/bin/clang "$@"
          EOF
          chmod +x $(pwd)/bin/clang
          
          cat << 'EOF' > $(pwd)/bin/clang++
          #!/bin/bash
          exec ccache /usr/bin/clang++ "$@"
          EOF
          chmod +x $(pwd)/bin/clang++

          ln -sf $(pwd)/bin/clang $(pwd)/bin/cc
          ln -sf $(pwd)/bin/clang $(pwd)/bin/gcc
          ln -sf $(pwd)/bin/clang++ $(pwd)/bin/c++
          ln -sf $(pwd)/bin/clang++ $(pwd)/bin/g++
          
          ln -sf $(pwd)/bin/clang $(pwd)/bin/aarch64-linux-gnu-gcc
          ln -sf $(pwd)/bin/clang $(pwd)/bin/aarch64-linux-gnu-cc
          ln -sf $(pwd)/bin/clang++ $(pwd)/bin/aarch64-linux-gnu-g++
          ln -sf $(pwd)/bin/clang++ $(pwd)/bin/aarch64-linux-gnu-c++
          
          for tool in ar ranlib nm strip objcopy objdump readelf size strings; do
            ln -sf "/usr/bin/llvm-$tool" "$(pwd)/bin/$tool"
            ln -sf "/usr/bin/llvm-$tool" "$(pwd)/bin/aarch64-linux-gnu-$tool"
          done
          
          ln -sf /usr/bin/ld.lld $(pwd)/bin/ld
          ln -sf /usr/bin/ld.lld $(pwd)/bin/aarch64-linux-gnu-ld
          
          export PATH="$(pwd)/bin:/usr/lib/ccache:$PATH"
          
          export CPLUS_INCLUDE_PATH="$LIBDIR/imath/include:$LIBDIR/openexr/include:$LIBDIR/openimageio/include"
          export C_INCLUDE_PATH="$LIBDIR/imath/include:$LIBDIR/openexr/include:$LIBDIR/openimageio/include"
          
          export CXXFLAGS="-D_GLIBCXX_USE_CXX11_ABI=0"
          
          LINK_STR="-fopenmp -Wl,--no-as-needed"
          
          for lib in "$LIBDIR/usd/lib/libusd"*.a "$LIBDIR/usd/lib/libusd"*.so "$LIBDIR/tbb/lib/libtbb"*.so "$LIBDIR/tbb/lib/libtbb"*.a "$LIBDIR/materialx/lib/libMaterialXCore"*.so "$LIBDIR/materialx/lib/libMaterialXCore"*.a "$LIBDIR/materialx/lib/libMaterialXFormat"*.so "$LIBDIR/materialx/lib/libMaterialXFormat"*.a "$LIBDIR/x265/lib/libx265.a" "$LIBDIR/x264/lib/libx264.a" "$LIBDIR/aom/lib/libaom.a" "$LIBDIR/vpx/lib/libvpx.a" "$LIBDIR/tiff/lib/libtiff.a" "$LIBDIR/deflate/lib/libdeflate.a"; do
            if [ -f "$lib" ]; then
              if [[ "$lib" == *"libusd"*.a ]]; then
                LINK_STR="$LINK_STR \"-Wl,--whole-archive\" \"$lib\" \"-Wl,--no-whole-archive\""
              else
                LINK_STR="$LINK_STR \"$lib\""
              fi
            fi
          done
          
          LINK_STR="$LINK_STR -Wl,--as-needed \"-lGL\" \"-lX11\" \"-ldl\""
          
          echo "target_link_libraries(blender PRIVATE $LINK_STR)" >> blender/source/creator/CMakeLists.txt
          
          FREETYPE_STATIC_LIB="$LIBDIR/freetype/lib/libfreetype2ST.a"
          
          mkdir -p build_blender && cd build_blender
          
          cmake ../blender \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-D_GLIBCXX_USE_CXX11_ABI=0" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--undefined-version" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--undefined-version" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld -Wl,--undefined-version" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBDIR="$LIBDIR" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DPYTHON_VERSION=3.11 \
            -DFREETYPE_LIBRARY="$FREETYPE_STATIC_LIB" \
            -DFREETYPE_LIBRARY_RELEASE="$FREETYPE_STATIC_LIB" \
            -DOPENEXR_INCLUDE_DIR="$LIBDIR/openexr/include" \
            -DIMATH_INCLUDE_DIR="$LIBDIR/imath/include" \
            -DOPENIMAGEIO_INCLUDE_DIR="$LIBDIR/openimageio/include" \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_DEVICE_CUDA=OFF \
            -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIP=OFF \
            -DWITH_CYCLES_DEVICE_SYCL=OFF \
            -DWITH_CYCLES_DEVICE_ONEAPI=OFF \
            -DWITH_CYCLES_DEVICE_METAL=OFF 
            
          make -j$(nproc)
          make install
        
      - name: Create Release Tarball
        run: |
          cd build_blender
          
          tar -cJf blender-4.2-linux-arm64.tar.xz bin/
          ls -lh blender-4.2-linux-arm64.tar.xz
          
      - name: Upload To Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blender-arm64-bin-4.2
          name: blender 4.2 arm64 binary
          files: build_blender/blender-4.2-linux-arm64.tar.xz
