name: Build Blender Deps

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Blender 5.2
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          path: blender
          fetch-depth: 1
          ref: blender-v5.2-release

      - name: Install Host-side Packages
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update -qq
          
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends \
            build-essential cmake ccache git subversion curl xz-utils bzip2 patch \
            bison yasm tcl autoconf automake m4 meson patchelf gettext autopoint \
            pkg-config ninja-build xutils-dev xsltproc xmlto help2man flex \
            clang llvm lld \
            python3-jinja2 python3-markupsafe python3-mako python3-docutils \
            libc6-dev-armhf-cross linux-libc-dev-armhf-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Target Compatibility Patches
        run: |
          cd blender
          
          find build_files/cmake -type f -name "*.cmake" -exec sed -i -E 's|-fuse-ld=gold|-fuse-ld=lld|g' {} +
          find build_files/build_environment/cmake -name "*.cmake" -type f -exec sed -i -E \
            -e 's|\$\{SOURCE_DIR\}/configure |\$\{SOURCE_DIR\}/configure --build=aarch64-unknown-linux-gnu |g' \
            -e 's|\./configure |\./configure --build=aarch64-unknown-linux-gnu |g' \
            -e 's|-DCMAKE_C_COMPILER=[^[:space:]"]+/dpcpp/bin/clang|-DCMAKE_C_COMPILER=clang|g' \
            -e 's|-DCMAKE_CXX_COMPILER=[^[:space:]"]+/dpcpp/bin/clang\+\+|-DCMAKE_CXX_COMPILER=clang++|g' \
            -e 's|-DCMAKE_C_COMPILER=[^[:space:]"]+/dpcpp/bin/icx|-DCMAKE_C_COMPILER=clang|g' \
            -e 's|-DCMAKE_CXX_COMPILER=[^[:space:]"]+/dpcpp/bin/icpx|-DCMAKE_CXX_COMPILER=clang++|g' \
            -e 's/-DEMBREE_SYCL_SUPPORT=ON/-DEMBREE_SYCL_SUPPORT=OFF/g' \
            -e 's/-DOIDN_DEVICE_SYCL=ON/-DOIDN_DEVICE_SYCL=OFF/g' \
            -e 's/-DOIDN_DEVICE_HIP=ON/-DOIDN_DEVICE_HIP=OFF/g' \
            -e 's/-DOIDN_DEVICE_CUDA=ON/-DOIDN_DEVICE_CUDA=OFF/g' \
            {} +
          
          for intel_gpu_only in ocloc igc intel_compute_runtime dpcpp level_zero sycl; do
             tgt="build_files/build_environment/cmake/${intel_gpu_only}.cmake"
             [ -f "$tgt" ] && echo "add_custom_target(external_${intel_gpu_only})" > "$tgt" || true
          done
          
      - name: Fetch CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-aarch64-blender-5.2-deps
          restore-keys: ccache-Linux-aarch64-blender-5.2-deps
          max-size: 1G
          create-symlink: true

      - name: Build Blender Dependencies
        run: |
          mkdir -p $(pwd)/bin
          
          cat << 'EOF' > $(pwd)/bin/clang
          #!/bin/bash
          exec ccache /usr/bin/clang "$@"
          EOF
          chmod +x $(pwd)/bin/clang

          cat << 'EOF' > $(pwd)/bin/clang++
          #!/bin/bash
          exec ccache /usr/bin/clang++ "$@"
          EOF
          chmod +x $(pwd)/bin/clang++
          
          ln -sf $(pwd)/bin/clang $(pwd)/bin/cc
          ln -sf $(pwd)/bin/clang $(pwd)/bin/gcc
          ln -sf $(pwd)/bin/clang++ $(pwd)/bin/c++
          ln -sf $(pwd)/bin/clang++ $(pwd)/bin/g++
          
          ln -sf $(pwd)/bin/clang $(pwd)/bin/aarch64-linux-gnu-gcc
          ln -sf $(pwd)/bin/clang $(pwd)/bin/aarch64-linux-gnu-cc
          ln -sf $(pwd)/bin/clang++ $(pwd)/bin/aarch64-linux-gnu-g++
          ln -sf $(pwd)/bin/clang++ $(pwd)/bin/aarch64-linux-gnu-c++

          for tool in ar ranlib nm strip objcopy objdump readelf size strings; do
            ln -sf "/usr/bin/llvm-$tool" "$(pwd)/bin/$tool"
            ln -sf "/usr/bin/llvm-$tool" "$(pwd)/bin/aarch64-linux-gnu-$tool"
          done
          
          ln -sf /usr/bin/ld.lld $(pwd)/bin/ld
          ln -sf /usr/bin/ld.lld $(pwd)/bin/aarch64-linux-gnu-ld
          
          export PATH="$(pwd)/bin:/usr/lib/ccache:$PATH"
          export ISPC_EXTRA_ARGS="--target=neon --arch=aarch64"
          
          mkdir -p build_deps && cd build_deps

          export CC=clang
          export CXX=clang++
          
          cmake ../blender/build_files/build_environment \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SYCL=OFF
            
          echo "__PY__"
          ninja external_python || {
              echo "py build failure"
              exit 1
          }
          
          echo "__OTHERS__"
          ninja -j$(nproc) || {
              echo "build failure"
              ls -laR $(pwd)/Release/python || true
              exit 1
          }
         
      - name: Create Release Tarball
        run: |
          cd build_deps
          tar -cJf blender-deps-5.2-arm64.tar.xz Release
          ls -lh blender-deps-5.2-arm64.tar.xz

      - name: Upload To Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blender-arm64-deps-5.2
          name: blender 5.2 arm64 deps
          files: build_deps/blender-deps-5.2-arm64.tar.xz
