name: Build Blender Deps

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Blender 5.2
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          path: blender
          fetch-depth: 1
          ref: blender-v5.2-release

      - name: Install Host-side Packages
        run: |
          sudo apt-get update -qq
          
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends \
            build-essential cmake ccache git subversion curl xz-utils bzip2 patch \
            clang llvm lld pkg-config ninja-build flex file \
            bison yasm tcl autoconf automake m4 meson patchelf gettext autopoint \
            xutils-dev xsltproc xmlto help2man asciidoc docbook-xml docbook-xsl \
            python3-mako python3-docutils \
            libudev-dev libinput-dev libevdev-dev libmtdev-dev libseat-dev libpixman-1-dev \
            libpulse-dev libasound2-dev libjack-dev libpipewire-0.3-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev libxt-dev libxext-dev libxrender-dev libxfixes-dev \
            libx11-xcb-dev libxcb-dri3-dev libxcb-present-dev libxshmfence-dev \
            libgl1-mesa-dev libgl-dev libgles2-mesa-dev libgles-dev libegl-dev \
            libglx-dev libopengl-dev libglu1-mesa-dev libvulkan-dev libdrm-dev libgbm-dev \
            libcairo2-dev libpango1.0-dev libffi-dev
            
      - name: Target Compatibility Patches
        run: |
          cd blender
          
          find build_files/build_environment/cmake -name "*.cmake" -type f -exec sed -i -E \
            -e 's|\$\{SOURCE_DIR\}/configure |\$\{SOURCE_DIR\}/configure --build=aarch64-unknown-linux-gnu |g' \
            -e 's|\./configure |\./configure --build=aarch64-unknown-linux-gnu |g' \
            -e 's|-DCMAKE_C_COMPILER=[^[:space:]"]+/dpcpp/bin/clang|-DCMAKE_C_COMPILER=clang|g' \
            -e 's|-DCMAKE_CXX_COMPILER=[^[:space:]"]+/dpcpp/bin/clang\+\+|-DCMAKE_CXX_COMPILER=clang++|g' \
            -e 's|-DCMAKE_C_COMPILER=[^[:space:]"]+/dpcpp/bin/icx|-DCMAKE_C_COMPILER=clang|g' \
            -e 's|-DCMAKE_CXX_COMPILER=[^[:space:]"]+/dpcpp/bin/icpx|-DCMAKE_CXX_COMPILER=clang++|g' \
            -e 's/-DEMBREE_SYCL_SUPPORT=ON/-DEMBREE_SYCL_SUPPORT=OFF/g' \
            -e 's/-DOIDN_DEVICE_SYCL=ON/-DOIDN_DEVICE_SYCL=OFF/g' \
            -e 's/-DOIDN_DEVICE_HIP=ON/-DOIDN_DEVICE_HIP=OFF/g' \
            -e 's/-DOIDN_DEVICE_CUDA=ON/-DOIDN_DEVICE_CUDA=OFF/g' \
            {} +
          
          for intel_gpu_only in ocloc igc intel_compute_runtime dpcpp level_zero sycl; do
             tgt="build_files/build_environment/cmake/${intel_gpu_only}.cmake"
             [ -f "$tgt" ] && echo "add_custom_target(external_${intel_gpu_only})" > "$tgt" || true
          done
          
      - name: Fetch CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-aarch64-blender-5.2-deps
          restore-keys: ccache-Linux-aarch64-blender-5.2-deps
          max-size: 1.5G
          create-symlink: true

      - name: Pre-load Archives
        run: |
          mkdir -p build_deps/packages
         
          curl -L "https://mirrors.kernel.org/gnu/gmp/gmp-6.3.0.tar.xz" -o build_deps/packages/gmp-6.3.0.tar.xz

      - name: Build Blender Dependencies
        run: |
          mkdir -p $(pwd)/bin
          
          cat << 'EOF' > $(pwd)/bin/clang
          #!/bin/bash
          exec ccache /usr/bin/clang "$@"
          EOF
          chmod +x $(pwd)/bin/clang

          cat << 'EOF' > $(pwd)/bin/clang++
          #!/bin/bash
          exec ccache /usr/bin/clang++ "$@"
          EOF
          chmod +x $(pwd)/bin/clang++
          
          sudo ln -sf $(pwd)/bin/clang /usr/bin/gcc
          sudo ln -sf $(pwd)/bin/clang /usr/bin/cc
          sudo ln -sf $(pwd)/bin/clang /usr/bin/aarch64-linux-gnu-gcc
          sudo ln -sf $(pwd)/bin/clang /usr/bin/aarch64-linux-gnu-cc
          
          sudo ln -sf $(pwd)/bin/clang++ /usr/bin/g++
          sudo ln -sf $(pwd)/bin/clang++ /usr/bin/c++
          sudo ln -sf $(pwd)/bin/clang++ /usr/bin/aarch64-linux-gnu-g++
          sudo ln -sf $(pwd)/bin/clang++ /usr/bin/aarch64-linux-gnu-c++

          for tool in ar ranlib nm strip objcopy objdump readelf size strings; do
            sudo ln -sf /usr/bin/llvm-$tool /usr/bin/$tool
            sudo ln -sf /usr/bin/llvm-$tool /usr/bin/aarch64-linux-gnu-$tool
          done

          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld
          sudo ln -sf /usr/bin/ld.lld /usr/bin/aarch64-linux-gnu-ld
          
          export PATH="$(pwd)/bin:/usr/lib/ccache:$PATH"
          
          cd build_deps

          export CC=clang
          export CXX=clang++
          export LDFLAGS="-fuse-ld=lld -Wl,--undefined-version"

          export ISPC_EXTRA_ARGS="--target=neon --arch=aarch64"
          
          cmake ../blender/build_files/build_environment \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SYCL=OFF

          make -j$(nproc) external_python

          PY_BIN="$(pwd)/Release/python/bin/python3.13"
          
          $PY_BIN -m ensurepip
          $PY_BIN -m pip install setuptools wheel packaging jinja2 markupsafe
          
          make -j$(nproc)
         
      - name: Create Release Tarball
        run: |
          cd build_deps
          tar -cJf blender-deps-5.2-arm64.tar.xz Release
          ls -lh blender-deps-5.2-arm64.tar.xz

      - name: Upload To Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blender-arm64-deps-5.2
          name: blender 5.2 arm64 deps
          files: build_deps/blender-deps-5.2-arm64.tar.xz
